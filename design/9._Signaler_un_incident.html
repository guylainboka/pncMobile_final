  <script>
    (function () {
      var btns = document.querySelectorAll('[data-cat-btn]');
      btns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          btns.forEach(function (b) {
            b.className = 'bg-light-surface-container-low border border-light-outline-variant rounded-md p-3 flex flex-col items-center text-center gap-2 hover:border-light-primary transition-colors';

          });
          btn.className = 'bg-light-secondary-container border-2 border-light-primary-container rounded-md p-3 flex flex-col items-center text-center gap-2 transition-colors';
          btn.querySelector('.material-symbols-outlined').className = 'material-symbols-outlined text-[24px] text-light-primary';
        });
      });
      var ta = document.getElementById('incident-desc');
      var counter = document.getElementById('char-count');
      if (ta && counter) {
        ta.addEventListener('input', function () {
          counter.textContent = ta.value.length + '/500';
        });
      }
    })();
